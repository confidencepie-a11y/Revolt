<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000010">
<title>Crypto App</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.8 11.3 11 4.6a1.4 1.4 0 0 1 2 0l7.2 6.7c.5.4.2 1.2-.4 1.2H19v6.6a2 2 0 0 1-2 2h-3v-5h-4v5H7a2 2 0 0 1-2-2v-6.6h-.8c-.6 0-.9-.8-.4-1.2z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M20.4 3.9 4 10.5c-1 .4-.9 1.8.1 2l6.3 1.5 1.5 6.3c.2 1 1.6 1.1 2 .1z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 5.5h11v-3l5.5 4.5-5.5 4.5v-3H4z M20 15.5H9v-3l-5.5 4.5L9 21.5v-3h11z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="m15.5 15.5 4.5 4.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><rect x="4" y="12" width="4.2" height="8" rx="1.6" fill="currentColor"/><rect x="9.9" y="4" width="4.2" height="16" rx="1.6" fill="currentColor"/><rect x="15.8" y="9" width="4.2" height="11" rx="1.6" fill="currentColor"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3.5" fill="currentColor"/><rect x="2.5" y="8.6" width="19" height="2.6" fill="#0a0a30" opacity=".55"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 5.5h11v-3l5.5 4.5-5.5 4.5v-3H4z M20 15.5H9v-3l-5.5 4.5L9 21.5v-3h11z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="M12 3 3 8.2c-.6.3-.4 1.3.3 1.3H20.7c.7 0 .9-1 .3-1.3z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><rect x="5" y="11" width="3" height="6" rx="1" fill="currentColor"/><rect x="10.5" y="11" width="3" height="6" rx="1" fill="currentColor"/><rect x="16" y="11" width="3" height="6" rx="1" fill="currentColor"/><rect x="3.5" y="18.5" width="17" height="2.6" rx="1.3" fill="currentColor"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></symbol>
  </defs>
</svg>

<main class="app">
  <header class="topbar">
    <button class="avatar" aria-label="Profile"><span></span></button>
    <label class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="text" placeholder="Search" aria-label="Search">
    </label>
    <button class="round-btn" aria-label="Stats"><svg class="ic"><use href="#i-chart"/></svg></button>
    <button class="round-btn" aria-label="Cards"><svg class="ic"><use href="#i-card"/></svg></button>
  </header>

  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="balance">
      <p class="balance-label">Personal · All accounts</p>
      <h1 class="balance-amount">$0<span>.00</span></h1>
      <button class="pill-btn">Accounts</button>
    </div>

    <div class="dots"><i></i><i></i><i class="on"></i></div>

    <div class="actions">
      <button><span class="circle"><svg class="ic"><use href="#i-plus"/></svg></span>Add money</button>
      <button><span class="circle"><svg class="ic"><use href="#i-move"/></svg></span>Move</button>
      <button><span class="circle"><svg class="ic"><use href="#i-bank"/></svg></span>Details</button>
      <button><span class="circle"><svg class="ic"><use href="#i-more"/></svg></span>More</button>
    </div>

    <div class="card">
      <h2 class="card-title">Assets</h2>
      <p class="empty">No assets</p>
    </div>

    <div class="card">
      <h2 class="card-title">Products for you <span class="chev">›</span></h2>
      <div class="spacer"></div>
    </div>
  </section>

  <!-- SEND -->
  <section class="view" id="view-send">
    <div class="screen-head"><h1>Send</h1></div>
    <div class="card"><h2 class="card-title">Recipients</h2><p class="empty">No recipients yet</p></div>
  </section>

  <!-- SWAP -->
  <section class="view" id="view-swap">
    <div class="screen-head"><h1>Swap</h1></div>
    <div class="card"><h2 class="card-title">Swap</h2><p class="empty">Add assets to start swapping</p></div>
  </section>
</main>

<nav class="dock" aria-label="Main navigation">
  <button class="tab active" data-view="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
  <button class="tab" data-view="send"><svg class="ic"><use href="#i-send"/></svg><span>Send</span></button>
  <button class="tab" data-view="swap"><svg class="ic"><use href="#i-swap"/></svg><span>Swap</span></button>
</nav>

<script src="script.js"></script>
</body>
</html>
